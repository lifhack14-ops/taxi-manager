<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 18px 16px;
    padding-top: calc(18px + env(safe-area-inset-top));
}

.header-inner {
    max-width: 900px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

h1 {
    margin: 0;
    font-size: 24px;
}

.subtitle {
    margin-top: 4px;
    color: #d1d5db;
    font-size: 13px;
}

.lang-buttons {
    display: flex;
    gap: 6px;
}

.lang-buttons button {
    border: 1px solid #4b5563;
    background: transparent;
    color: white;
    padding: 7px 9px;
    border-radius: 8px;
    cursor: pointer;
}

.lang-buttons button.active {
    background: white;
    color: #111827;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 14px;
    padding-bottom: calc(30px + env(safe-area-inset-bottom));
}

.card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.card h2 {
    margin: 0 0 14px;
    font-size: 19px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.field.full {
    grid-column: 1 / -1;
}

label {
    font-size: 13px;
    color: #4b5563;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

input:focus {
    outline: none;
    border-color: #2563eb;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 12px 15px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.primary {
    background: #2563eb;
    color: white;
    flex: 1;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
}

.danger {
    background: #fee2e2;
    color: #991b1b;
}

.small-button {
    padding: 8px 10px;
    font-size: 13px;
}

.install-box {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1e3a8a;
}

.auth-status {
    padding: 11px 12px;
    border-radius: 10px;
    background: #f3f4f6;
    margin-bottom: 12px;
    font-size: 14px;
}

.auth-status.connected {
    background: #ecfdf5;
    color: #065f46;
}

.auth-status.offline {
    background: #fff7ed;
    color: #9a3412;
}

.auth-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.auth-actions button {
    flex: 1;
    min-width: 130px;
}

.message {
    margin-top: 10px;
    padding: 10px;
    border-radius: 9px;
    display: none;
    font-size: 14px;
}

.message.show {
    display: block;
}

.message.success {
    background: #dcfce7;
    color: #166534;
}

.message.error {
    background: #fee2e2;
    color: #991b1b;
}

.stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.stat {
    background: #f9fafb;
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
}

.stat-value {
    font-size: 18px;
    font-weight: 700;
}

.stat-label {
    margin-top: 4px;
    font-size: 11px;
    color: #6b7280;
}

.history-item {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 10px;
}

.history-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
}

.history-date {
    font-weight: 700;
}

.history-main {
    margin-top: 8px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px 15px;
    font-size: 13px;
    color: #4b5563;
}

.history-actions {
    display: flex;
    gap: 7px;
    margin-top: 10px;
}

.empty {
    color: #6b7280;
    text-align: center;
    padding: 20px 5px;
}

.hidden {
    display: none !important;
}

.sync-line {
    margin-top: 8px;
    font-size: 12px;
    color: #6b7280;
}

@media (max-width: 700px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats .stat:last-child {
        grid-column: 1 / -1;
    }
}

@media (max-width: 560px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }

    .header-inner {
        align-items: flex-start;
    }

    .history-main {
        grid-template-columns: 1fr;
    }
}
</style>

<script>
/* =========================================================

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Bk6mnQQQFh1G7pjwxxsDBg_OS9zj3rM";

let supabaseClient = null;

if (window.supabase) {
    supabaseClient = window.supabase.createClient(

}


/* =========================================================

========================================================= */

const translations = {

        emptyFields: "Вкажи дату, початок і кінець роботи.",
        installTitle: "📱 Встановлення",
        installText: "На iPhone натисни «Поділитися» → «На початковий екран».",
        newDay: "Новий робочий день",
        editDay: "Редагування робочого дня",

    },

    pl: {

        password: "Hasło",
        login: "Zaloguj",
        register: "Utwórz konto",
        logout: "Wyloguj",
        sync: "🔄 Synchronizuj",
        date: "Data",
        break: "Przerwa, min",
        start: "Początek",
        end: "Koniec",
        otherApps: "Inne aplikacje",
        cash: "Gotówka",
        tips: "Napiwki",
        fuel: "Paliwo",
        otherExpenses: "Inne wydatki",
        save: "💾 Zapisz",
        clear: "Wyczyść",
        totalStats: "Statystyki ogólne",
        monthStats: "Statystyki miesiąca",

        localUploaded: "Lokalne zapisy przesłane do chmury.",
        emptyFields: "Podaj datę, początek i koniec pracy.",
        installTitle: "📱 Instalacja",
        installText: "Na iPhone kliknij „Udostępnij” → „Dodaj do ekranu początkowego”.",

        hour: "godz.",
        minute: "min"
    }
};


/* =========================================================
   LANGUAGE
========================================================= */

let currentLanguage = localStorage.getItem("taxiLanguage") || "uk";

function t(key) {
    return translations[currentLanguage][key] || key;
}

function setLanguage(language) {
    currentLanguage = language;
    localStorage.setItem("taxiLanguage", language);
    updateLanguageUI();
    renderAll();
}

function updateLanguageUI() {
    document.documentElement.lang = currentLanguage;

    document.getElementById("subtitle").textContent = t("subtitle");
    document.getElementById("installTitle").textContent = t("installTitle");
    document.getElementById("installText").textContent = t("installText");

    document.getElementById("ukBtn").classList.toggle(
        "active",
        currentLanguage === "uk"
    );

    document.getElementById("plBtn").classList.toggle(
        "active",
        currentLanguage === "pl"
    );

    document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t(el.dataset.i18n);
    });

    document.getElementById("formTitle").textContent =
        editingId ? t("editDay") : t("newDay");

    updateAuthUI();
}


/* =========================================================
   LOCAL DATA
========================================================= */

let entries = [];

try {
    entries = JSON.parse(localStorage.getItem("taxiEntries") || "[]");
} catch {
    entries = [];
}

let editingId = null;
let currentUser = null;
let syncRunning = false;

let deletedClientIds = [];

try {
    deletedClientIds = JSON.parse(
        localStorage.getItem("taxiDeletedIds") || "[]"
    );
} catch {
    deletedClientIds = [];
}


/* =========================================================
   HELPERS
========================================================= */

function makeClientId() {
    if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
    }

    return Date.now() + "-" + Math.random().toString(36).slice(2);
}

function saveLocal() {
    localStorage.setItem("taxiEntries", JSON.stringify(entries));
    localStorage.setItem(
        "taxiDeletedIds",
        JSON.stringify(deletedClientIds)
    );
}

function numberValue(id) {
    return Number(document.getElementById(id).value) || 0;
}

function timeToMinutes(time) {
    if (!time) return 0;

    const [hours, minutes] = time.split(":").map(Number);
    return hours * 60 + minutes;
}

function calculateDuration(start, end) {
    let startMinutes = timeToMinutes(start);
    let endMinutes = timeToMinutes(end);

    if (endMinutes < startMinutes) {
        endMinutes += 24 * 60;
    }

    return Math.max(0, endMinutes - startMinutes);
}

function formatHours(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;

    if (m === 0) {
        return `${h} ${t("hour")}`;
    }

    return `${h} ${t("hour")} ${m} ${t("minute")}`;
}

function money(value) {
    return Number(value || 0).toFixed(2);
}

function formatDate(date) {
    if (!date) return "";

    const parts = date.split("-");

    if (parts.length !== 3) return date;

    return `${parts[2]}.${parts[1]}.${parts[0]}`;
}

function setDefaultDate() {
    const input = document.getElementById("date");

    if (!input.value) {
        const now = new Date();
        const local = new Date(
            now.getTime() - now.getTimezoneOffset() * 60000
        );

        input.value = local.toISOString().slice(0, 10);
    }
}


/* =========================================================
   MIGRATION OF OLD LOCAL DATA
========================================================= */

entries = entries.map(item => {
    const clientId = item.clientId || makeClientId();

    const breakMinutes = Number(item.breakMinutes || 0);
    const totalDuration = Number(
        item.totalDuration ||
        calculateDuration(item.startTime, item.endTime)
    );

    const duration = Math.max(
        0,
        totalDuration - breakMinutes
    );

    const uber = Number(item.uber || 0);
    const bolt = Number(item.bolt || 0);
    const otherApps = Number(item.otherApps || 0);
    const tips = Number(item.tips || 0);

    const cash = Number(item.cash || 0);

    const fuel = Number(item.fuel || 0);
    const otherExpenses = Number(item.otherExpenses || 0);

    const income =
        uber +
        bolt +
        otherApps +
        tips;

    const expenses =
        fuel +
        otherExpenses;

    const profit =
        income -
        expenses;

    return {
        ...item,
        clientId,
        totalDuration,
        breakMinutes,
        duration,
        uber,
        bolt,
        otherApps,
        cash,
        tips,
        fuel,
        otherExpenses,
        income,
        expenses,
        profit,
        updatedAt: item.updatedAt || Date.now()
    };
});

/* =========================================================
   AUTH UI
========================================================= */

function updateAuthUI() {
    const loggedOut = document.getElementById("authLoggedOut");
    const loggedIn = document.getElementById("authLoggedIn");
    const status = document.getElementById("accountStatus");

    if (!loggedOut || !loggedIn) return;

    if (currentUser) {
        loggedOut.classList.add("hidden");
        loggedIn.classList.remove("hidden");

        status.textContent =
            t("loggedIn") +
            (currentUser.email || "");
    } else {
        loggedOut.classList.remove("hidden");
        loggedIn.classList.add("hidden");
    }
}

function showAuthMessage(message, type = "success") {
    const box = document.getElementById("authMessage");

    box.textContent = message;
    box.className = "message show " + type;
}

function showFormMessage(message, type = "success") {
    const box = document.getElementById("formMessage");

    box.textContent = message;
    box.className = "message show " + type;

    setTimeout(() => {
        box.classList.remove("show");
    }, 3000);
}

function setSyncStatus(message) {
    document.getElementById("syncStatus").textContent =

}


/* =========================================================
   AUTH
========================================================= */

function getRedirectUrl() {
    return window.location.href.split("#")[0];
}

async function registerAccount() {
    if (!supabaseClient) {
        showAuthMessage(
            "Supabase не завантажився. Перевір інтернет.",
            "error"
        );
        return;
    }

    const email =
        document.getElementById("authEmail").value.trim();

    const password =
        document.getElementById("authPassword").value;

    if (!email || !password) {
        showAuthMessage(t("fillAuth"), "error");
        return;
    }

    if (password.length < 6) {
        showAuthMessage(t("passwordShort"), "error");
        return;
    }

    showAuthMessage(t("syncing"), "success");

    const { data, error } =
        await supabaseClient.auth.signUp({
            email,
            password,
            options: {
                emailRedirectTo: getRedirectUrl()
            }
        });

    if (error) {
        showAuthMessage(error.message, "error");
        return;
    }

    if (data.session && data.user) {
        currentUser = data.user;

        updateAuthUI();

        showAuthMessage(
            t("accountReady"),
            "success"
        );

        await syncWithCloud(true);
    } else {
        showAuthMessage(
            t("accountCreated"),
            "success"
        );
    }
}

async function loginAccount() {
    if (!supabaseClient) {
        showAuthMessage(
            "Supabase не завантажився. Перевір інтернет.",
            "error"
        );
        return;
    }

    const email =
        document.getElementById("authEmail").value.trim();

    const password =
        document.getElementById("authPassword").value;

    if (!email || !password) {
        showAuthMessage(t("fillAuth"), "error");
        return;
    }

    showAuthMessage(t("syncing"), "success");

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if (error) {
        showAuthMessage(
            t("wrongCredentials"),
            "error"
        );
        return;
    }

    currentUser = data.user;

    updateAuthUI();

    showAuthMessage(
        t("loginSuccess"),
        "success"
    );

    await syncWithCloud(true);
}

async function logoutAccount() {
    if (!supabaseClient) return;

    const { error } =
        await supabaseClient.auth.signOut();

    if (error) {
        showAuthMessage(error.message, "error");
        return;
    }

    currentUser = null;

    updateAuthUI();

    setSyncStatus("");

    showAuthMessage(
        t("logoutSuccess"),
        "success"
    );
}


/* =========================================================
   CLOUD SYNC
========================================================= */

async function syncEntryToCloud(entry) {
    if (!currentUser || !supabaseClient) return;

    const { error } =
        await supabaseClient
            .from("work_entries")
            .upsert(
                toCloudRow(entry),
                {
                    onConflict: "user_id,client_id"
                }
            );

    if (error) {
        throw error;
    }
}

async function deleteEntryFromCloud(clientId) {
    if (!currentUser || !supabaseClient) return;

    const { error } =
        await supabaseClient
            .from("work_entries")
            .delete()
            .eq("user_id", currentUser.id)
            .eq("client_id", String(clientId));

    if (error) {
        throw error;
    }
}

async function syncDeletedItems() {
    if (!currentUser || !supabaseClient) return;

    if (!deletedClientIds.length) return;

    const copy = [...deletedClientIds];

    for (const clientId of copy) {
        try {
            await deleteEntryFromCloud(clientId);

            deletedClientIds =
                deletedClientIds.filter(
                    id => String(id) !== String(clientId)
                );

            saveLocal();
        } catch (error) {
            console.error(error);
        }
    }
}

async function syncWithCloud(showMessageAfter = false) {
    if (!currentUser || !supabaseClient) {
        return;
    }

    if (syncRunning) return;

    if (!navigator.onLine) {
        setSyncStatus(t("offline"));
        return;
    }

    syncRunning = true;

    setSyncStatus(t("syncing"));

    try {
        /* First remove cloud records that were deleted locally */
        await syncDeletedItems();

        const { data: cloudRows, error } =
            await supabaseClient
                .from("work_entries")
                .select("*")
                .eq("user_id", currentUser.id);

        if (error) {
            throw error;
        }

        const cloudEntries =
            (cloudRows || []).map(fromCloudRow);

        const localMap = new Map();

        entries.forEach(entry => {
            localMap.set(
                String(entry.clientId),
                entry
            );
        });

        const cloudMap = new Map();

        cloudEntries.forEach(entry => {
            cloudMap.set(
                String(entry.clientId),
                entry
            );
        });

        const mergedMap = new Map();

        /* Local entries */
        localMap.forEach((local, clientId) => {
            const cloud = cloudMap.get(clientId);

            if (!cloud) {
                mergedMap.set(clientId, local);
                return;
            }

            const localTime =
                Number(local.updatedAt || 0);

            const cloudTime =
                Number(cloud.updatedAt || 0);

            if (cloudTime > localTime) {
                mergedMap.set(clientId, cloud);
            } else {
                mergedMap.set(clientId, local);
            }
        });

        /* Cloud-only entries */
        cloudMap.forEach((cloud, clientId) => {
            if (!mergedMap.has(clientId)) {
                mergedMap.set(clientId, cloud);
            }
        });

        entries = Array.from(mergedMap.values());

        saveLocal();

        /*
         * Upload the merged list.
         * This also uploads local data on first login.
         */
        for (const entry of entries) {
            await syncEntryToCloud(entry);
        }

        renderAll();

        setSyncStatus(t("syncDone"));

        if (showMessageAfter) {
            if (cloudEntries.length > 0) {
                showAuthMessage(
                    t("cloudLoaded"),
                    "success"
                );
            } else if (entries.length > 0) {
                showAuthMessage(
                    t("localUploaded"),
                    "success"
                );
            } else {
                showAuthMessage(
                    t("syncDone"),
                    "success"
                );
            }
        }

    } catch (error) {
        console.error("Cloud sync error:", error);

        setSyncStatus(
            t("syncError") + error.message
        );

        if (showMessageAfter) {
            showAuthMessage(
                t("syncError") + error.message,
                "error"
            );
        }
    } finally {
        syncRunning = false;
    }
}


/* =========================================================
   SAVE ENTRY
========================================================= */

async function saveEntry() {
    const date =
        document.getElementById("date").value;

    const startTime =
        document.getElementById("startTime").value;

    const endTime =
        document.getElementById("endTime").value;

    const breakMinutes =
        Math.max(
            0,
            Number(
                document.getElementById("breakMinutes").value
            ) || 0
        );

    if (!date || !startTime || !endTime) {
        showFormMessage(
            t("emptyFields"),
            "error"
        );
        return;
    }

    const totalDuration =
        calculateDuration(
            startTime,
            endTime
        );

    const duration =
        Math.max(
            0,
            totalDuration - breakMinutes
        );

    const uber = numberValue("uber");
    const bolt = numberValue("bolt");
    const otherApps = numberValue("otherApps");
    const cash = numberValue("cash");
    const tips = numberValue("tips");

    const fuel = numberValue("fuel");
    const otherExpenses =
        numberValue("otherExpenses");

    /*
     * Cash is NOT included in income.
     */
    const income =
        uber +
        bolt +
        otherApps +
        tips;

    const expenses =
        fuel +
        otherExpenses;

    const profit =
        income -
        expenses;

    let entry;

    if (editingId) {
        const oldEntry =
            entries.find(
                item =>
                    String(item.clientId) ===
                    String(editingId)
            );

        if (!oldEntry) {
            editingId = null;
            return;
        }

        entry = {
            ...oldEntry,

            date,
            startTime,
            endTime,

            totalDuration,
            breakMinutes,
            duration,

            uber,
            bolt,
            otherApps,
            cash,
            tips,

            fuel,
            otherExpenses,

            income,
            expenses,
            profit,

            updatedAt: Date.now()
        };

        entries = entries.map(item =>
            String(item.clientId) ===
            String(editingId)
                ? entry
                : item
        );

    } else {
        entry = {
            id: Date.now(),
            clientId: makeClientId(),

            date,
            startTime,
            endTime,

            totalDuration,
            breakMinutes,
            duration,

            uber,
            bolt,
            otherApps,
            cash,
            tips,

            fuel,
            otherExpenses,

            income,
            expenses,
            profit,

            updatedAt: Date.now()
        };

        entries.push(entry);
    }

    saveLocal();

    renderAll();

    clearForm();

    showFormMessage(
        t("saveSuccess"),
        "success"
    );

    /*
     * Sync immediately if logged in.
     * If offline, local data remains safe and
     * will synchronize when connection returns.
     */
    if (currentUser && navigator.onLine) {
        try {
            await syncEntryToCloud(entry);
            setSyncStatus(t("syncDone"));
        } catch (error) {
            console.error(error);

            setSyncStatus(
                t("syncError") + error.message
            );
        }
    } else if (currentUser) {
        setSyncStatus(t("offline"));
    }
}

/* =========================================================
   EDIT
========================================================= */

function editEntry(clientId) {
    const entry =
        entries.find(
            item =>
                String(item.clientId) ===
                String(clientId)
        );

    if (!entry) return;

    editingId = entry.clientId;

    document.getElementById("date").value =
        entry.date || "";

    document.getElementById("startTime").value =
        entry.startTime || "";

    document.getElementById("endTime").value =
        entry.endTime || "";

    document.getElementById("breakMinutes").value =
        entry.breakMinutes || 0;

    document.getElementById("uber").value =
        entry.uber || "";

    document.getElementById("bolt").value =
        entry.bolt || "";

    document.getElementById("otherApps").value =
        entry.otherApps || "";

    document.getElementById("cash").value =
        entry.cash || "";

    document.getElementById("tips").value =
        entry.tips || "";

    document.getElementById("fuel").value =
        entry.fuel || "";

    document.getElementById("otherExpenses").value =
        entry.otherExpenses || "";

    document.getElementById("formTitle").textContent =
        t("editDay");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   DELETE
========================================================= */

async function deleteEntry(clientId) {
    if (!confirm(t("deleteConfirm"))) {
        return;
    }

    const entry =
        entries.find(
            item =>
                String(item.clientId) ===
                String(clientId)
        );

    if (!entry) return;

    entries =
        entries.filter(
            item =>
                String(item.clientId) !==
                String(clientId)
        );

    saveLocal();

    renderAll();

    showFormMessage(
        t("deleteSuccess"),
        "success"
    );

    if (currentUser) {
        if (navigator.onLine) {
            try {
                await deleteEntryFromCloud(
                    entry.clientId
                );

                setSyncStatus(t("syncDone"));

            } catch (error) {
                console.error(error);

                if (
                    !deletedClientIds.includes(
                        entry.clientId
                    )
                ) {
                    deletedClientIds.push(
                        entry.clientId
                    );

                    saveLocal();
                }

                setSyncStatus(
                    t("syncError") +
                    error.message
                );
            }
        } else {
            if (
                !deletedClientIds.includes(
                    entry.clientId
                )
            ) {
                deletedClientIds.push(
                    entry.clientId
                );
            }

            saveLocal();

            setSyncStatus(t("offline"));
        }
    }
}

        entries.reduce(

                sum +

            0
        );

    const totalCash =
        entries.reduce(
            (sum, item) =>
                sum +
                Number(item.cash || 0),
            0

    document.getElementById("totalDays").textContent =

function renderMonthStats() {
    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth() + 1)
            .padStart(2, "0");

    const prefix =
        `${year}-${month}`;

    const monthEntries =
        entries.filter(
            item =>
                String(item.date || "")
                    .startsWith(prefix)
        );

    const days =
        monthEntries.length;

    const minutes =
        monthEntries.reduce(
            (sum, item) =>
                sum +
                Number(item.duration || 0),
            0
        );

    const income =
        monthEntries.reduce(
            (sum, item) =>
                sum +
                Number(item.income || 0),
            0
        );

    const cash =
        monthEntries.reduce(
            (sum, item) =>
                sum +
                Number(item.cash || 0),
            0
        );

    const profit =
        monthEntries.reduce(
            (sum, item) =>
                sum +
                Number(item.profit || 0),
            0
        );

    document.getElementById("monthDays").textContent =
        days;

    document.getElementById("monthHours").textContent =
        formatHours(minutes);

    document.getElementById("monthIncome").textContent =
        money(income);

    document.getElementById("monthCash").textContent =
        money(cash);

    document.getElementById("monthProfit").textContent =
        money(profit);
}


/* =========================================================
   HISTORY
========================================================= */

function renderEntries() {
    const container =
        document.getElementById("entriesList");

    if (!entries.length) {
        container.innerHTML =
            `<div class="empty">${t("noEntries")}</div>`;

        return;
    }

    const sorted =
        [...entries].sort(
            (a, b) =>
                String(b.date).localeCompare(
                    String(a.date)
                )
        );

    container.innerHTML =
        sorted.map(item => {

            const rate =
                item.duration > 0
                    ? item.profit /
                      (item.duration / 60)
                    : 0;

            return `
                <div class="history-item">

                    <div class="history-top">
                        <div>
                            <div class="history-date">
                                ${formatDate(item.date)}
                            </div>

                            <div style="font-size:13px;color:#6b7280;margin-top:3px;">
                                ${item.startTime} – ${item.endTime}
                            </div>
                        </div>

                        <strong>
                            ${money(item.profit)}
                        </strong>
                    </div>

                    <div class="history-main">

                        <div>
                            ⏱️ ${formatHours(
                                Number(item.duration || 0)
                            )}
                        </div>

                        <div>
                            💰 ${t("income")}:
                            ${money(item.income)}
                        </div>

                        <div>
                            💵 ${t("cash")}:
                            ${money(item.cash)}
                        </div>

                        <div>
                            ⛽ ${t("fuel")}:
                            ${money(item.fuel)}
                        </div>

                        <div>
                            💸 ${t("otherExpenses")}:
                            ${money(item.otherExpenses)}
                        </div>

                        <div>
                            📈 ${money(rate)}/h
                        </div>

                    </div>

                    <div class="history-actions">

                        <button
                            class="secondary small-button"
                            onclick="editEntry('${String(item.clientId)}')">
                            ✏️ ${t("edit")}
                        </button>

                        <button
                            class="danger small-button"
                            onclick="deleteEntry('${String(item.clientId)}')">
                            🗑️ ${t("delete")}
                        </button>

                    </div>

                </div>
            `;
        }).join("");
}


/* =========================================================
   CSV
========================================================= */

function exportCSV() {
    const headers = [
        "Date",
        "Start",
        "End",
        "Total minutes",
        "Break minutes",
        "Worked minutes",
        "Uber",
        "Bolt",
        "Other apps",
        "Cash",
        "Tips",
        "Fuel",
        "Other expenses",
        "Income",
        "Expenses",
        "Profit"
    ];

    const rows =
        entries.map(item => [
            item.date,
            item.startTime,
            item.endTime,
            item.totalDuration,
            item.breakMinutes,
            item.duration,
            item.uber,
            item.bolt,
            item.otherApps,
            item.cash,
            item.tips,
            item.fuel,
            item.otherExpenses,
            item.income,
            item.expenses,
            item.profit
        ]);

    const csv =
        [headers, ...rows]
            .map(row =>
                row.map(value => {
                    const text =
                        String(value ?? "");

                    return `"${text.replace(
                        /"/g,
                        '""'
                    )}"`;
                }).join(",")
            )
            .join("\n");

    const blob =
        new Blob(
            ["\uFEFF" + csv],
            {
                type: "text/csv;charset=utf-8;"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        `taxi-manager-${new Date()
            .toISOString()
            .slice(0,10)}.csv`;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);
}


/* =========================================================
   RENDER
========================================================= */

function renderAll() {
    updateLanguageUI();

    renderTotalStats();
    renderMonthStats();
    renderEntries();
}


/* =========================================================
   AUTH INITIALIZATION
========================================================= */

async function initAuth() {
    if (!supabaseClient) {
        updateAuthUI();
        return;
    }

    const {
        data
    } = await supabaseClient.auth.getSession();

    currentUser =
        data.session?.user || null;

    updateAuthUI();

    if (currentUser) {
        setTimeout(
            () => syncWithCloud(false),
            0
        );
    }

    supabaseClient.auth.onAuthStateChange(
        (event, session) => {

            currentUser =
                session?.user || null;

            updateAuthUI();

            if (session?.user) {
                setTimeout(
                    () => syncWithCloud(false),
                    0
                );
            }
        }
    );
}

   ONLINE / OFFLINE
========================================================= */

window.addEventListener(
    "online",
    () => {
        if (currentUser) {
            syncWithCloud(false);
        }
    }
);

window.addEventListener(
    "offline",
    () => {
        if (currentUser) {
            setSyncStatus(t("offline"));
        }
    }
);
